kind = "web"
previewPath = "/"
title = "Thesis Management System"
version = "1.0.0"
id = "artifacts/thesis-mgmt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21277

[services.development]
run = "pnpm --filter @workspace/thesis-mgmt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thesis-mgmt", "run", "build" ]
publicDir = "artifacts/thesis-mgmt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21277"
BASE_PATH = "/"
